name: Email diario de analítica

on:
  schedule:
    # 05:00 y 06:00 UTC. El script solo envía cuando en Madrid son las 7,
    # así que siempre sale a las 7am (verano CEST=05:00 UTC, invierno CET=06:00 UTC).
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # botón para lanzarlo a mano (envía al momento, sin esperar a las 7)

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install "google-analytics-data==0.18.*" google-api-python-client google-auth
      - name: Enviar email
        env:
          GA_CLIENT_ID: ${{ secrets.GA_CLIENT_ID }}
          GA_CLIENT_SECRET: ${{ secrets.GA_CLIENT_SECRET }}
          GA_REFRESH_TOKEN: ${{ secrets.GA_REFRESH_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/daily_analytics.py
