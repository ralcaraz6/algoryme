:root{--paper:#FAF7F0;--cream:#F2ECDE;--card:#FEFCF8;--ink:#211D18;--muted:#6B6153;--line:#E4DFD4;
--siena:#B5401C;--sans:'Sora',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);font-family:var(--sans);color:var(--ink);padding:44px 32px 70px}
.head{max-width:1080px;margin:0 auto 30px}
.head h1{font-size:22px;letter-spacing:-.025em}
.head p{font:500 12.5px/1.6 var(--mono);color:var(--muted);margin-top:6px;max-width:74ch}
.grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:34px 30px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.cc{display:flex;flex-direction:column;gap:11px}
.cc-head{display:flex;align-items:center;gap:11px}
.cc-n{background:var(--siena);color:var(--card);border-radius:6px;font:700 11px var(--mono);
  padding:2px 8px;letter-spacing:.06em}
.cc-name{font:600 12px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--siena)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;
  height:380px;box-shadow:0 1px 2px rgba(33,29,24,.04),0 10px 30px rgba(33,29,24,.05);overflow:hidden}
.cc-why{font:500 11.5px/1.6 var(--mono);color:var(--muted)}
.cc-why b{color:var(--ink);font-weight:600}
/* ===== k1 · Las siete en punto ===== */
.k1-wrap{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.k1-label{
  margin:0;
  font-family:var(--mono);
  font-size:11px;
  line-height:1;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}

.k1-clock{
  margin:34px 0 38px;
  display:flex;
  align-items:flex-start;
  font-family:var(--mono);
  font-weight:500;
  font-size:100px;
  line-height:1.1;
  letter-spacing:-.04em;
  color:var(--ink);
  animation:none;
}

.k1-clock > span{
  display:block;
  height:1.1em;
  line-height:1.1em;
}

.k1-reel{overflow:hidden}

.k1-strip{
  display:block;
  animation:k1-roll 9s steps(1,end) infinite;
}

.k1-strip span{
  display:block;
  height:1.1em;
  line-height:1.1em;
}

.k1-colon{color:var(--siena)}

.k1-note{
  margin:0;
  max-width:24ch;
  font-family:var(--sans);
  font-size:15px;
  font-weight:400;
  line-height:1.6;
  color:var(--muted);
}

@keyframes k1-roll{
  0%{transform:translateY(0)}
  2%{transform:translateY(-1.1em)}
  4%{transform:translateY(-2.2em)}
  6%{transform:translateY(-3.3em)}
  8%{transform:translateY(-4.4em)}
  10%{transform:translateY(-5.5em)}
  12%{transform:translateY(-6.6em)}
  14%{transform:translateY(-7.7em)}
  100%{transform:translateY(-7.7em)}
}

@keyframes k1-reveal{
  0%,100%{opacity:1}
}

@media (prefers-reduced-motion: reduce){
  .k1-clock,.k1-strip{animation:none}
  .k1-clock{opacity:1}
  .k1-strip{transform:translateY(-7.7em)}
}
/* ===== k2 · La barra que se vacía ===== */
.k2-wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.k2-title{margin:0;max-width:280px;font-family:var(--sans);font-size:27px;line-height:1.3;font-weight:500;letter-spacing:-.015em;color:var(--ink)}
.k2-meter{margin-bottom:10px}
.k2-tags{display:flex;justify-content:flex-end;align-items:baseline;margin-bottom:16px}
.k2-tag{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.k2-tag--next{opacity:.2;animation:k2-reveal 7s cubic-bezier(.45,0,.25,1) infinite}
.k2-track{position:relative;height:8px;border-radius:2px;background:var(--cream);overflow:hidden}
.k2-bar{position:absolute;inset:0;border-radius:2px;background:var(--siena);transform-origin:left center;animation:k2-drain 7s cubic-bezier(.45,0,.25,1) infinite}
@keyframes k2-drain{0%,8%{transform:scaleX(1);opacity:1}64%,92%{transform:scaleX(.06);opacity:1}96%{transform:scaleX(.06);opacity:0}97%{transform:scaleX(1);opacity:0}100%{transform:scaleX(1);opacity:1}}
@keyframes k2-reveal{0%,8%{opacity:.35}64%,92%{opacity:1}100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.k2-bar{animation:none;transform:scaleX(.14)}.k2-tag--next{animation:none;opacity:1}}
/* ===== k3 · Una línea en producción ===== */
.k3-wrap{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
}

.k3-tag{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
  opacity:.7;
}

.k3-mid{
  margin-top:auto;
  margin-bottom:auto;
}

.k3-line{
  display:flex;
  align-items:center;
  font-family:var(--mono);
  font-size:17px;
  line-height:1.4;
  color:var(--ink);
}

.k3-typed{
  flex:0 0 auto;
  overflow:hidden;
  white-space:nowrap;
  width:0;
  animation:k3-type 7.2s steps(26,end) infinite;
}

.k3-caret{
  flex:0 0 auto;
  width:9px;
  height:19px;
  margin-left:3px;
  background:var(--siena);
  border-radius:1px;
  animation:k3-blink 1.1s infinite;
}

.k3-say{
  margin:22px 0 0;
  max-width:30ch;
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  color:var(--muted);
  opacity:0;
  animation:k3-fade 7.2s ease infinite;
}

@keyframes k3-type{
  0%{width:0}
  30%{width:26.2ch}
  88%{width:26.2ch}
  100%{width:0}
}

@keyframes k3-blink{
  0%,50%{opacity:1}
  50.01%,100%{opacity:0}
}

@keyframes k3-fade{
  0%,26%{opacity:0;transform:translateY(6px)}
  40%,84%{opacity:1;transform:translateY(0)}
  92%,100%{opacity:0;transform:translateY(6px)}
}

@media (prefers-reduced-motion:reduce){
  .k3-typed{animation:none;width:auto}
  .k3-caret{animation:none;opacity:1}
  .k3-say{animation:none;opacity:1;transform:none}
}
/* ===== k4 · La palabra que rota ===== */
.k4-wrap{position:relative;height:100%;display:flex;flex-direction:column;font-family:var(--sans)}
.k4-phrase{margin:auto 0}
.k4-fixed{margin:0;font-size:34px;line-height:1.15;font-weight:500;letter-spacing:-0.02em;color:var(--ink)}
.k4-rotor{position:relative;height:58px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 90%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 90%,transparent 100%)}
.k4-stack{display:block;animation:k4-roll 16s cubic-bezier(.65,0,.35,1) infinite}
.k4-word{display:block;height:58px;line-height:58px;font-size:34px;font-weight:600;letter-spacing:-0.02em;color:var(--siena);white-space:nowrap}
.k4-foot{margin:0;font-family:var(--mono);font-size:11px;line-height:1.6;letter-spacing:.04em;color:var(--muted)}
@keyframes k4-roll{
  0%,7%{transform:translateY(0)}
  11%,32%{transform:translateY(-58px)}
  36%,57%{transform:translateY(-116px)}
  61%,82%{transform:translateY(-174px)}
  86%,100%{transform:translateY(-232px)}
}
@media (prefers-reduced-motion: reduce){
  .k4-stack{animation:none;transform:none}
  .k4-word{display:none}
  .k4-word:first-child{display:block}
  .k4-rotor{-webkit-mask-image:none;mask-image:none}
}
/* ===== k5 · Turno de noche ===== */
.k5-wrap{position:relative;display:flex;flex-direction:column;height:100%}
.k5-label{margin:0;font-family:var(--mono);font-size:10px;line-height:1;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.k5-gauge{position:relative;width:100%;max-width:316px;margin:34px auto 0}
.k5-svg{display:block;width:100%;height:auto}
.k5-track{fill:none;stroke:var(--line);stroke-width:1.5}
.k5-ticks line{stroke:var(--line);stroke-width:1.5}
.k5-prog{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:408.4 408.4;stroke-dashoffset:408.4;animation:k5-sweep 7s linear infinite}
.k5-dot{fill:none;stroke:var(--siena);stroke-width:6;stroke-linecap:round;stroke-dasharray:.1 1000;stroke-dashoffset:0;animation:k5-travel 7s linear infinite}
.k5-read{position:absolute;left:0;right:0;bottom:12%;margin:0;text-align:center;font-family:var(--mono);font-size:40px;line-height:1;letter-spacing:-.02em;color:var(--muted);opacity:.45;animation:k5-lock 7s linear infinite}
.k5-note{margin:auto 0 0;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--muted)}
@keyframes k5-sweep{0%{stroke-dashoffset:408.4;opacity:0}5%{stroke-dashoffset:378.4;opacity:1}68%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes k5-travel{0%{stroke-dashoffset:0;opacity:0}5%{stroke-dashoffset:-30;opacity:1}68%{stroke-dashoffset:-408.4;opacity:1}90%{stroke-dashoffset:-408.4;opacity:1}100%{stroke-dashoffset:-408.4;opacity:0}}
@keyframes k5-lock{0%,55%{color:var(--muted);opacity:.45}70%,90%{color:var(--ink);opacity:1}100%{color:var(--muted);opacity:.45}}
@media (prefers-reduced-motion:reduce){.k5-prog{animation:none;stroke-dashoffset:0;opacity:1}.k5-dot{animation:none;stroke-dashoffset:-408.4;opacity:1}.k5-read{animation:none;color:var(--ink);opacity:1}}
/* ===== k6 · Dos sistemas conectados ===== */
.k6-wrap{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
}

.k6-diagram{
  position:relative;
  height:64px;
  margin-top:46px;
}

.k6-track{
  position:absolute;
  top:26px;
  left:6px;
  right:6px;
  height:1px;
  background:var(--line);
}

.k6-node{
  position:absolute;
  top:50%;
  width:11px;
  height:11px;
  border:1px solid var(--muted);
  border-radius:50%;
  background:var(--card);
  transform:translate(-50%,-50%);
}

.k6-a{ left:0; }

.k6-b{
  left:100%;
  animation:k6-arrive 6.4s linear infinite;
}

.k6-dot{
  position:absolute;
  top:50%;
  left:50%;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--siena);
  box-shadow:0 0 0 4px rgba(181,64,28,.09);
  transform:translate(-50%,-50%);
  animation:k6-travel 6s cubic-bezier(.5,0,.5,1) infinite;
}

.k6-label{
  position:absolute;
  top:48px;
  font-family:var(--mono);
  font-size:10px;
  line-height:1;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}

.k6-label-a{ left:0; }
.k6-label-b{ right:0; }

.k6-claim{
  margin:auto 0 0 0;
  font-family:var(--sans);
  font-size:21px;
  font-weight:500;
  line-height:1.42;
  letter-spacing:-.015em;
  color:var(--ink);
}

@keyframes k6-arrive{
  0%,52%   { border-color:var(--muted); transform:translate(-50%,-50%) scale(1); }
  58%      { border-color:var(--ink);   transform:translate(-50%,-50%) scale(1.35); }
  74%,100% { border-color:var(--muted); transform:translate(-50%,-50%) scale(1); }
}

@media (prefers-reduced-motion: reduce){
  .k6-dot{ animation:none; left:50%; opacity:1; }
  .k6-b{ animation:none; border-color:var(--muted); transform:translate(-50%,-50%) scale(1); }
}
@keyframes k6-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(var(--k6-run,240px));opacity:0}}

/* ===== k7 · La lista que se tacha ===== */
.k7-wrap{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.k7-list{
  padding-top:30px;
}

.k7-line{
  position:relative;
  display:block;
  width:fit-content;
  margin:0;
  font-family:var(--sans);
  font-size:21px;
  font-weight:400;
  line-height:1.15;
  letter-spacing:-0.012em;
  color:var(--ink);
  animation:k7-dim 8s ease-in-out infinite;
  animation-delay:var(--k7-d,0s);
}

.k7-line + .k7-line{margin-top:34px}

.k7-l2{--k7-d:0.9s}
.k7-l3{--k7-d:1.8s}

.k7-strike{
  position:absolute;
  left:-3px;
  right:-3px;
  top:53%;
  height:1px;
  background:var(--siena);
  transform:scaleX(0);
  transform-origin:left center;
  animation:k7-strike 8s cubic-bezier(.4,0,.2,1) infinite;
  animation-delay:var(--k7-d,0s);
}

.k7-foot{
  margin:0;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-family:var(--mono);
  font-size:11.5px;
  letter-spacing:0.06em;
  color:var(--muted);
}

@keyframes k7-strike{
  0%,7%{transform:scaleX(0);opacity:1}
  24%,74%{transform:scaleX(1);opacity:1}
  88%,100%{transform:scaleX(1);opacity:0}
}

@keyframes k7-dim{
  0%,10%{color:var(--ink)}
  26%,74%{color:var(--muted)}
  90%,100%{color:var(--ink)}
}

@media (prefers-reduced-motion: reduce){
  .k7-line{animation:none;color:var(--ink)}
  .k7-strike{animation:none;transform:scaleX(1);opacity:1}
}
/* ===== k8 · Cursor en producción ===== */
.k8-wrap{
  position:relative;
  height:100%;
  min-height:300px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.k8-frase{
  margin:0;
  font-family:var(--sans);
  font-size:38px;
  font-weight:600;
  line-height:1.16;
  letter-spacing:-0.025em;
  color:var(--ink);
}

.k8-a,
.k8-b{
  display:block;
  opacity:0;
  animation:k8-entra .9s cubic-bezier(.2,.7,.2,1) both;
}

.k8-a{animation-delay:.15s;}

.k8-b{
  color:var(--muted);
  font-weight:500;
  animation-delay:.4s;
}

.k8-cursor{
  display:inline-block;
  width:.34em;
  height:.74em;
  margin-left:.16em;
  border-radius:1px;
  background:var(--siena);
  animation:k8-parpadeo 3.8s ease-in-out 1.4s infinite;
}

.k8-pie{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  margin:0;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.2em;
  color:var(--muted);
  opacity:0;
  animation:k8-entra .9s cubic-bezier(.2,.7,.2,1) .75s both;
}

@keyframes k8-entra{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:none;}
}

@keyframes k8-parpadeo{
  0%,42%{opacity:1;}
  54%,66%{opacity:.1;}
  78%,100%{opacity:1;}
}

@media (prefers-reduced-motion: reduce){
  .k8-a,
  .k8-b,
  .k8-pie,
  .k8-cursor{
    animation:none;
    opacity:1;
    transform:none;
  }
}
/* ===== k9 · La curva que baja ===== */
.k9-wrap{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
  font-family:var(--sans);
}

.k9-eyebrow{
  margin:0;
  font-family:var(--mono);
  font-size:11px;
  font-weight:400;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}

.k9-claim{
  margin:20px 0 0;
  font-family:var(--sans);
  font-weight:500;
  font-size:27px;
  line-height:1.2;
  letter-spacing:-.015em;
  color:var(--ink);
}

.k9-chart{margin-top:auto}

.k9-svg{display:block;width:100%;height:auto}

.k9-ghost{
  fill:none;
  stroke:var(--line);
  stroke-width:1.5;
  stroke-linecap:round;
}

.k9-line{
  fill:none;
  stroke:var(--ink);
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  animation:k9-draw 7s linear infinite;
}

.k9-dot{
  fill:var(--siena);
  opacity:0;
  transform-box:fill-box;
  transform-origin:center;
  animation:k9-arrive 7s linear infinite;
}

.k9-now{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.1em;
  fill:var(--muted);
  opacity:0;
  animation:k9-appear 7s linear infinite;
}

@keyframes k9-draw{
  0%,4%   {stroke-dashoffset:100;opacity:1}
  58%,86% {stroke-dashoffset:0;opacity:1}
  96%,100%{stroke-dashoffset:0;opacity:0}
}

@keyframes k9-arrive{
  0%,56%  {opacity:0;transform:scale(.4)}
  64%,86% {opacity:1;transform:scale(1)}
  96%,100%{opacity:0;transform:scale(1)}
}

@keyframes k9-appear{
  0%,58%  {opacity:0}
  66%,86% {opacity:1}
  96%,100%{opacity:0}
}

@media (prefers-reduced-motion: reduce){
  .k9-line,.k9-dot,.k9-now{animation:none}
  .k9-line{stroke-dashoffset:0}
  .k9-dot{opacity:1;transform:none}
  .k9-now{opacity:1}
}
/* ===== k10 · Mismo sitio, otro estado ===== */
.k10-wrap{
  position: relative;
  height: 100%;
  min-height: 300px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  font-family: var(--sans);
}

.k10-tag{
  position: absolute;
  top: 0;
  left: 0;
  margin: 0;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1;
  letter-spacing: .12em;
  text-transform: lowercase;
  color: var(--muted);
}

.k10-swap{
  position: relative;
  height: 62px;
  overflow: hidden;
}

.k10-state{
  position: absolute;
  left: 0;
  bottom: 0;
  margin: 0;
  font-size: 44px;
  line-height: 1.05;
  font-weight: 600;
  letter-spacing: -.025em;
  white-space: nowrap;
  will-change: transform, opacity;
}

.k10-antes{
  color: var(--ink);
  animation: k10-antes 8s ease-in-out infinite;
}

.k10-despues{
  color: var(--siena);
  animation: k10-despues 8s ease-in-out infinite;
}

.k10-rule{
  height: 1px;
  margin-top: 22px;
  background: var(--line);
  transform: scaleX(.34);
  transform-origin: left center;
  animation: k10-rule 8s ease-in-out infinite;
}

.k10-nota{
  margin: 16px 0 0;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: .06em;
  color: var(--muted);
  opacity: 0;
  animation: k10-nota 8s ease-in-out infinite;
}

@keyframes k10-antes{
  0%, 34%   { opacity: 1; transform: translateY(0); }
  50%       { opacity: 0; transform: translateY(-14px); }
  88%       { opacity: 0; transform: translateY(-14px); }
  97.5%     { opacity: 0; transform: translateY(14px); }
  100%      { opacity: 1; transform: translateY(0); }
}

@keyframes k10-despues{
  0%, 42%   { opacity: 0; transform: translateY(14px); }
  50%, 94%  { opacity: 1; transform: translateY(0); }
  94%, 100% { opacity: 0; transform: translateY(-14px); }
}

@keyframes k10-rule{
  0%, 40%   { transform: scaleX(.34); }
  56%, 86%  { transform: scaleX(1); }
  100%      { transform: scaleX(.34); }
}

@keyframes k10-nota{
  0%, 46%   { opacity: 0; }
  62%, 86%  { opacity: 1; }
  96%, 100% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce){
  .k10-swap{
    height: auto;
    overflow: visible;
  }
  .k10-state{
    position: static;
    display: block;
    animation: none;
    opacity: 1;
    transform: none;
  }
  .k10-antes{
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--line);
    margin-bottom: 12px;
  }
  .k10-rule{
    animation: none;
    transform: none;
  }
  .k10-nota{
    animation: none;
    opacity: 1;
  }
}

/* SOLO PARA LA CAPTURA ESTÁTICA: congela cada animación 6s dentro de su propio ciclo,
   para que la imagen muestre el estado con mensaje y no un fotograma intermedio. */
.panel *, .panel{ animation-delay:-6s !important; animation-play-state:paused !important; }
</style></head><body>
<div class="head">
  <h1>Panel del hero · 10 conceptos minimalistas</h1>
  <p>Todos animados en bucle. Espera unos segundos en cada uno para ver el movimiento completo.
  Mismo marco, paleta y tipografías que la web. Dime un número.</p>
</div>
<div class="grid">
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">1</span>
      <span class="cc-name">Las siete en punto</span>
    </figcaption>
    <div class="panel"><div class="k1-wrap">
  <p class="k1-label">todos los días</p>

  <p class="k1-clock" role="img" aria-label="07:00"><span aria-hidden="true">0</span><span class="k1-reel" aria-hidden="true"><span class="k1-strip"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></span></span><span class="k1-colon" aria-hidden="true">:</span><span aria-hidden="true">0</span><span aria-hidden="true">0</span></p>

  <p class="k1-note">Ya se ha ejecutado. Nadie lo ha lanzado.</p>
</div></div>
    <p class="cc-why"><b>Idea.</b> Lo que construimos está en producción: a las 07:00 el trabajo ya está hecho sin que nadie lo lance.</p>
    <p class="cc-why"><b>Movimiento.</b> El dígito de la hora rueda 0→7 como un contador mecánico hasta fijarse en 07:00, se mantiene tres segundos y se desvanece para volver a empezar (ciclo de 7s).</p>
  </figure>
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">2</span>
      <span class="cc-name">La barra que se vacía</span>
    </figcaption>
    <div class="panel"><div class="k2-wrap">
  <p class="k2-title">El trabajo manual se encoge solo.</p>
  <div class="k2-meter">
    <div class="k2-tags">
      <span class="k2-tag k2-tag--next">Automático</span>
    </div>
    <div class="k2-track"><div class="k2-bar"></div></div>
  </div>
</div></div>
    <p class="cc-why"><b>Idea.</b> El trabajo repetitivo que hoy se hace a mano va desapareciendo hasta quedar en nada, sin que nadie lo empuje.</p>
    <p class="cc-why"><b>Movimiento.</b> La barra siena se encoge desde la derecha hacia casi cero en un ciclo pausado de 7 s, mientras la etiqueta "Automático" gana presencia al mismo ritmo; al final la barra se desvanece y vuelve a llenarse en silencio.</p>
  </figure>
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">3</span>
      <span class="cc-name">Una línea en producción</span>
    </figcaption>
    <div class="panel"><div class="k3-wrap">
  <span class="k3-tag">en producción</span>

  <div class="k3-mid">
    <div class="k3-line"><span class="k3-typed">04:00 · cierre-diario · ok</span><span class="k3-caret" aria-hidden="true"></span></div>
    <p class="k3-say">Se ejecuta solo. Todos los días.</p>
  </div>
</div></div>
    <p class="cc-why"><b>Idea.</b> Lo que construimos ya está corriendo en producción: una línea de log de las 04:00 que aparece sin que nadie la lance.</p>
    <p class="cc-why"><b>Movimiento.</b> La línea de log se escribe sola en 2 s con un cursor de bloque siena parpadeando, la frase aparece al terminar, y tras una pausa larga la línea se borra y el ciclo de 7,2 s vuelve a empezar, como una ejecución que se repite cada día.</p>
  </figure>
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">4</span>
      <span class="cc-name">La palabra que rota</span>
    </figcaption>
    <div class="panel"><div class="k4-wrap">
  <div class="k4-phrase">
    <p class="k4-fixed">Se encarga</p>
    <div class="k4-rotor">
      <div class="k4-stack">
        <span class="k4-word">de los informes.</span>
        <span class="k4-word">de las facturas.</span>
        <span class="k4-word">del CRM.</span>
        <span class="k4-word">de las respuestas.</span>
        <span class="k4-word" aria-hidden="true">de los informes.</span>
      </div>
    </div>
  </div>
  <p class="k4-foot">Todos los días. Sin que nadie lo lance.</p>
</div></div>
    <p class="cc-why"><b>Idea.</b> Una sola frase que se completa sola: el trabajo repetitivo (informes, facturas, CRM, respuestas) deja de hacerlo una persona.</p>
    <p class="cc-why"><b>Movimiento.</b> La última línea de la frase se desliza en vertical entre cuatro tareas reales, con pausas largas de unos 3 segundos y bucle continuo de 16s; el único movimiento del panel.</p>
  </figure>
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">5</span>
      <span class="cc-name">Turno de noche</span>
    </figcaption>
    <div class="panel"><div class="k5-wrap">
  <p class="k5-label">Turno de noche</p>
  <div class="k5-gauge">
    <svg class="k5-svg" viewBox="0 0 300 160" aria-hidden="true">
      <g class="k5-ticks">
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(-90 150 140)"/>
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(-70 150 140)"/>
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(-50 150 140)"/>
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(-30 150 140)"/>
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(-10 150 140)"/>
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(10 150 140)"/>
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(30 150 140)"/>
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(50 150 140)"/>
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(70 150 140)"/>
        <line x1="150" y1="14" x2="150" y2="22" transform="rotate(90 150 140)"/>
      </g>
      <path class="k5-track" d="M 20 140 A 130 130 0 0 1 280 140"/>
      <path class="k5-prog" d="M 20 140 A 130 130 0 0 1 280 140"/>
      <path class="k5-dot" d="M 20 140 A 130 130 0 0 1 280 140"/>
    </svg>
    <p class="k5-read">07:00</p>
  </div>
  <p class="k5-note">Se ejecuta solo. Cuando llegas, está hecho.</p>
</div></div>
    <p class="cc-why"><b>Idea.</b> El sistema recorre la noche entero y solo, y a las 07:00 el trabajo ya está terminado.</p>
    <p class="cc-why"><b>Movimiento.</b> Un punto siena recorre a velocidad constante el arco de la madrugada dejando tras de sí la línea de progreso; al llegar al final, el 07:00 pasa de gris a tinta y el ciclo de 7 s se reinicia con un desvanecido suave.</p>
  </figure>
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">6</span>
      <span class="cc-name">Dos sistemas conectados</span>
    </figcaption>
    <div class="panel"><div class="k6-wrap">
  <div class="k6-diagram">
    <div class="k6-track">
      <span class="k6-node k6-a"></span>
      <span class="k6-node k6-b"></span>
      <span class="k6-dot"></span>
    </div>
    <span class="k6-label k6-label-a">Pedidos</span>
    <span class="k6-label k6-label-b">Facturación</span>
  </div>

  <p class="k6-claim">Un sistema habla con otro.<br>Sin nadie en medio.</p>
</div></div>
    <p class="cc-why"><b>Idea.</b> Los datos se mueven solos entre dos sistemas del cliente, sin intervención manual.</p>
    <p class="cc-why"><b>Movimiento.</b> Un punto siena recorre la línea de un nodo al otro cada 6,4 s y el nodo receptor se marca al recibirlo, con una pausa antes de repetir.</p>
  </figure>
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">7</span>
      <span class="cc-name">La lista que se tacha</span>
    </figcaption>
    <div class="panel"><div class="k7-wrap">
  <div class="k7-list">
    <p class="k7-line">Conciliar facturas<span class="k7-strike"></span></p>
    <p class="k7-line k7-l2">Actualizar el CRM<span class="k7-strike"></span></p>
    <p class="k7-line k7-l3">Enviar el informe<span class="k7-strike"></span></p>
  </div>
  <p class="k7-foot">hecho a las 06:00 · cada día</p>
</div></div>
    <p class="cc-why"><b>Idea.</b> El trabajo manual repetitivo desaparece solo: tres tareas de siempre se tachan sin que nadie las abra, todos los días a la misma hora.</p>
    <p class="cc-why"><b>Movimiento.</b> Una línea siena de 1px recorre cada tarea de izquierda a derecha, una tras otra con 0,9s de separación; el texto se apaga a gris mientras está tachado y el trazo se desvanece para volver a empezar en un ciclo de 8s.</p>
  </figure>
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">8</span>
      <span class="cc-name">Cursor en producción</span>
    </figcaption>
    <div class="panel"><div class="k8-wrap">
  <p class="k8-frase">
    <span class="k8-a">Funciona solo.</span>
    <span class="k8-b">Todos los días.<i class="k8-cursor" aria-hidden="true"></i></span>
  </p>
  <p class="k8-pie">en producción</p>
</div></div>
    <p class="cc-why"><b>Idea.</b> Lo que construimos ya está en producción y se ejecuta solo cada día, sin nadie vigilándolo.</p>
    <p class="cc-why"><b>Movimiento.</b> Las dos líneas y el pie aparecen escalonados al cargar, y después solo se mueve el cursor de bloque siena, con un parpadeo lento de 3,8 s que sugiere un proceso vivo.</p>
  </figure>
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">9</span>
      <span class="cc-name">La curva que baja</span>
    </figcaption>
    <div class="panel"><div class="k9-wrap">
  <p class="k9-eyebrow">tiempo por proceso</p>
  <p class="k9-claim">Baja.<br>Y se queda abajo.</p>

  <div class="k9-chart">
    <svg class="k9-svg" viewBox="0 0 404 150" fill="none" aria-hidden="true">
      <path class="k9-ghost" d="M6 14C58 16 88 38 124 60c36 22 72 40 126 48 50 7 102 8 146 8"/>
      <path class="k9-line" pathLength="100" d="M6 14C58 16 88 38 124 60c36 22 72 40 126 48 50 7 102 8 146 8"/>
      <circle class="k9-dot" cx="396" cy="116" r="4"/>
      <text class="k9-now" x="398" y="138" text-anchor="end">hoy</text>
    </svg>
  </div>
</div></div>
    <p class="cc-why"><b>Idea.</b> El tiempo que cuesta un proceso desciende y se queda abajo: el ahorro no es un pico puntual, se sostiene solo.</p>
    <p class="cc-why"><b>Movimiento.</b> La curva se dibuja sola de izquierda a derecha con stroke-dasharray en 7s, al llegar al final aparece el punto siena con la etiqueta "hoy", se mantiene unos segundos y se desvanece para volver a empezar; la traza gris de fondo queda siempre visible como referencia.</p>
  </figure>
  <figure class="cc">
    <figcaption class="cc-head">
      <span class="cc-n">10</span>
      <span class="cc-name">Mismo sitio, otro estado</span>
    </figcaption>
    <div class="panel"><div class="k10-wrap">
  <div class="k10-tag">el mismo proceso</div>

  <div class="k10-swap">
    <div class="k10-state k10-antes">A mano</div>
    <div class="k10-state k10-despues">Automático</div>
  </div>

  <div class="k10-rule"></div>

  <div class="k10-nota">en producción, cada día</div>
</div></div>
    <p class="cc-why"><b>Idea.</b> El trabajo manual que desaparece: un mismo proceso, mismo espacio, pasa de hacerse a mano a funcionar solo en producción.</p>
    <p class="cc-why"><b>Movimiento.</b> Cada 8 s la palabra "A mano" se desvanece hacia arriba y "Automático" entra desde abajo en el mismo sitio, mientras la línea base se extiende y aparece la nota mono; luego vuelve al estado inicial.</p>
  </figure>
</div>
